<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Conquest: Tactics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; color: #fff; }

        /* Экран выбора страны */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }
        .start-box {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 30px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .start-title { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #58a6ff; text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; color: #8b949e; text-transform: uppercase; font-weight: 600; }
        .input-ctrl { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; outline: none; }
        .input-ctrl:focus { border-color: #58a6ff; }
        
        .start-btn {
            background: #238636; border: none; color: #fff; padding: 14px; font-weight: 700;
            font-size: 15px; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
        }
        .start-btn:hover { background: #2ea043; }

        /* Игровой холст и интерфейс */
        #game-canvas { width: 100vw; height: 100vh; display: block; background: #090c10; cursor: crosshair; }

        .hud-top {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: none;
        }
        .hud-card {
            background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d;
            padding: 10px 16px; border-radius: 8px; backdrop-filter: blur(8px); pointer-events: auto;
            display: flex; gap: 20px; align-items: center;
        }
        .hud-val { font-size: 18px; font-weight: 700; color: #58a6ff; }
        .hud-lbl { font-size: 11px; color: #8b949e; text-transform: uppercase; }

        .hud-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d;
            padding: 10px 20px; border-radius: 20px; font-size: 13px; color: #c9d1d9;
            backdrop-filter: blur(8px); text-align: center; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen">
        <div class="start-box">
            <div class="start-title">Глобальное Завоевание</div>
            
            <div class="input-group">
                <label>Выберите государство</label>
                <select class="input-ctrl" id="country-select" onchange="checkCustom(this.value)">
                    <option value="Россия">Россия (Центр)</option>
                    <option value="Украина">Украина</option>
                    <option value="Европа">Западная Европа</option>
                    <option value="США">США</option>
                    <option value="Китай">Китай</option>
                    <option value="custom">+ Создать свою державу</option>
                </select>
            </div>

            <div class="input-group" id="custom-name-box" style="display: none;">
                <label>Название вашей страны</label>
                <input type="text" class="input-ctrl" id="custom-name-input" placeholder="Введите название...">
            </div>

            <button class="start-btn" onclick="initGame()">Вступить в войну</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div class="hud-top">
        <div class="hud-card">
            <div>
                <div class="hud-lbl">Держава</div>
                <div class="hud-val" id="player-flag-name" style="color:#2f81f7;">Россия</div>
            </div>
            <div>
                <div class="hud-lbl">Регионы</div>
                <div class="hud-val" id="stat-regions">0</div>
            </div>
            <div>
                <div class="hud-lbl">Всего войск</div>
                <div class="hud-val" id="stat-troops">0</div>
            </div>
        </div>
    </div>

    <div class="hud-bottom">
        🖱️ <b>Нажми на свой регион</b> $\rightarrow$ затем <b>кликуй на врага</b> для атаки отрядом точек!
    </div>

    <canvas id="game-canvas"></canvas>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

// Данные о регионах (Географическая карта с узлами и полигонами)
const REGIONS = [
    { id: 'rus_west', name: 'Центральная Россия', x: 0.52, y: 0.32, radius: 45, owner: 'Россия', troops: 45 },
    { id: 'rus_south', name: 'Юг России / Кавказ', x: 0.53, y: 0.44, radius: 40, owner: 'Россия', troops: 35 },
    { id: 'rus_ural', name: 'Урал', x: 0.62, y: 0.30, radius: 42, owner: 'Россия', troops: 30 },
    { id: 'rus_sib', name: 'Сибирь', x: 0.74, y: 0.28, radius: 50, owner: 'Россия', troops: 50 },
    
    { id: 'ukr_east', name: 'Восточная Украина', x: 0.46, y: 0.39, radius: 35, owner: 'Украина', troops: 30 },
    { id: 'ukr_west', name: 'Западная Украина', x: 0.41, y: 0.38, radius: 35, owner: 'Украина', troops: 25 },
    
    { id: 'eur_east', name: 'Польша / Восточная Европа', x: 0.36, y: 0.34, radius: 38, owner: 'Европа', troops: 40 },
    { id: 'eur_west', name: 'Германия / Франция', x: 0.28, y: 0.36, radius: 42, owner: 'Европа', troops: 50 },
    { id: 'eur_south', name: 'Турция / Балканы', x: 0.42, y: 0.48, radius: 38, owner: 'Нейтралы', troops: 20 },

    { id: 'asia_chin', name: 'Китай', x: 0.76, y: 0.48, radius: 52, owner: 'Китай', troops: 60 },
    { id: 'asia_ind', name: 'Индия', x: 0.67, y: 0.56, radius: 45, owner: 'Нейтралы', troops: 35 },
    { id: 'usa_east', name: 'США (Восток)', x: 0.12, y: 0.38, radius: 45, owner: 'США', troops: 55 }
];

// Цвета фракций
const OWNER_COLORS = {
    'Россия': '#2f81f7',
    'Украина': '#e3b341',
    'Европа': '#a371f7',
    'Китай': '#f85149',
    'США': '#2ea043',
    'Нейтралы': '#484f58'
};

let playerFaction = 'Россия';
let selectedRegion = null;
let attackParticles = [];

class TroopParticle {
    constructor(fromX, fromY, toX, toY, owner, targetRegion) {
        this.x = fromX + (Math.random() - 0.5) * 15;
        this.y = fromY + (Math.random() - 0.5) * 15;
        this.toX = toX + (Math.random() - 0.5) * 15;
        this.toY = toY + (Math.random() - 0.5) * 15;
        this.owner = owner;
        this.targetRegion = targetRegion;
        this.speed = 2.5 + Math.random() * 1.0;
        this.done = false;
    }

    update() {
        let dx = this.toX - this.x;
        let dy = this.toY - this.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 5) {
            this.done = true;
            // Урон / захват при прибытии точки
            if (this.targetRegion.owner === this.owner) {
                this.targetRegion.troops += 1;
            } else {
                this.targetRegion.troops -= 1;
                if (this.targetRegion.troops <= 0) {
                    this.targetRegion.owner = this.owner;
                    this.targetRegion.troops = 1;
                }
            }
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = OWNER_COLORS[this.owner] || '#ffffff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function checkCustom(val) {
    document.getElementById('custom-name-box').style.display = val === 'custom' ? 'flex' : 'none';
}

function initGame() {
    let selectVal = document.getElementById('country-select').value;
    if (selectVal === 'custom') {
        playerFaction = document.getElementById('custom-name-input').value || 'Моя Держава';
        OWNER_COLORS[playerFaction] = '#00f0ff';
        // Назначаем игроку центральный регион
        REGIONS[0].owner = playerFaction;
    } else {
        playerFaction = selectVal;
    }

    document.getElementById('player-flag-name').innerText = playerFaction;
    document.getElementById('player-flag-name').style.color = OWNER_COLORS[playerFaction] || '#2f81f7';
    document.getElementById('start-screen').style.display = 'none';

    // Запуск постоянного прироста войск (Пассивный доход за территории)
    setInterval(() => {
        REGIONS.forEach(r => {
            if (r.owner !== 'Нейтралы' && r.troops < 120) {
                r.troops += 1;
            }
        });
    }, 1500);

    gameLoop();
}

// Обработка кликов
canvas.addEventListener('click', (e) => {
    let mx = e.clientX;
    let my = e.clientY;

    let clicked = REGIONS.find(r => {
        let rx = r.x * width;
        let ry = r.y * height;
        return Math.hypot(rx - mx, ry - my) < r.radius;
    });

    if (clicked) {
        if (clicked.owner === playerFaction) {
            selectedRegion = clicked;
        } else if (selectedRegion) {
            // Отправка атаки
            sendAttack(selectedRegion, clicked);
            selectedRegion = null;
        }
    } else {
        selectedRegion = null;
    }
});

function sendAttack(from, to) {
    let sendAmount = Math.floor(from.troops / 2);
    if (sendAmount <= 0) return;

    from.troops -= sendAmount;

    let fromX = from.x * width;
    let fromY = from.y * height;
    let toX = to.x * width;
    let toY = to.y * height;

    for (let i = 0; i < sendAmount; i++) {
        setTimeout(() => {
            attackParticles.push(new TroopParticle(fromX, fromY, toX, toY, from.owner, to));
        }, i * 100);
    }
}

function updateStats() {
    let myRegions = REGIONS.filter(r => r.owner === playerFaction);
    let totalTroops = myRegions.reduce((sum, r) => sum + r.troops, 0);

    document.getElementById('stat-regions').innerText = myRegions.length;
    document.getElementById('stat-troops').innerText = totalTroops;
}

function gameLoop() {
    ctx.clearRect(0, 0, width, height);

    // 1. Отрисовка связей фронта (линий)
    ctx.strokeStyle = '#161b22';
    ctx.lineWidth = 2;
    for (let i = 0; i < REGIONS.length; i++) {
        for (let j = i + 1; j < REGIONS.length; j++) {
            let r1 = REGIONS[i];
            let r2 = REGIONS[j];
            let dist = Math.hypot((r1.x - r2.x) * width, (r1.y - r2.y) * height);
            if (dist < width * 0.25) {
                ctx.beginPath();
                ctx.moveTo(r1.x * width, r1.y * height);
                ctx.lineTo(r2.x * width, r2.y * height);
                ctx.stroke();
            }
        }
    }

    // 2. Отрисовка регионов-крепостей
    REGIONS.forEach(r => {
        let rx = r.x * width;
        let ry = r.y * height;
        let color = OWNER_COLORS[r.owner] || '#8b949e';

        // Подсветка выбранной территории
        if (r === selectedRegion) {
            ctx.beginPath();
            ctx.arc(rx, ry, r.radius + 8, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Заливка узла
        ctx.beginPath();
        ctx.arc(rx, ry, r.radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.25;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Текст названия и войск
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(r.troops, rx, ry + 5);

        ctx.fillStyle = '#8b949e';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillText(r.name, rx, ry + r.radius + 16);
    });

    // 3. Обновление летящих точек-армий
    attackParticles = attackParticles.filter(p => !p.done);
    attackParticles.forEach(p => {
        p.update();
        p.draw();
    });

    updateStats();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
