<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War: Real Map & Human Dots</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #080c14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlay */
        .hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .hud-panel {
            background: rgba(13, 22, 38, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.3);
            backdrop-filter: blur(10px);
            padding: 12px 20px; border-radius: 12px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .title { font-size: 18px; font-weight: bold; color: #00d2ff; text-transform: uppercase; letter-spacing: 1px; }
        .stats { display: flex; gap: 20px; margin-top: 5px; font-size: 14px; }
        .stat-val { color: #ffcc00; font-weight: bold; }

        /* Help Panel */
        .help-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 16, 26, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; border-radius: 20px; font-size: 13px; color: #aaa;
            pointer-events: auto; text-align: center; backdrop-filter: blur(5px);
        }

        /* Action Menu */
        .action-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none; color: white; padding: 10px 18px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: 0.2s; pointer-events: auto;
            box-shadow: 0 0 10px rgba(255, 75, 43, 0.4);
        }
        .action-btn:hover { transform: scale(1.05); }
        .action-btn:active { transform: scale(0.95); }

        #soldier-info {
            position: absolute; bottom: 70px; right: 20px; width: 220px;
            background: rgba(13, 22, 38, 0.9); border: 1px solid #00d2ff;
            padding: 12px; border-radius: 10px; font-size: 12px; display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div class="hud-panel">
            <div class="title">World War: Real Map</div>
            <div class="stats">
                <div>Твоя страна: <span class="stat-val" id="my-country">Россия</span></div>
                <div>Людей в армии: <span class="stat-val" id="soldier-count">0</span></div>
                <div>Захвачено территорий: <span class="stat-val" id="territory-count">0</span></div>
            </div>
        </div>
        <button class="action-btn" onclick="mobilizeTroops()">+ Мобилизация (+10 Человек)</button>
    </div>

    <div class="help-box">
        🖱️ <b>ЛКМ по своей территории:</b> Выбрать регион | 🖱️ <b>ЛКМ по врагу:</b> Отправить отряд людей в марш | 📜 <b>Колесико:</b> Зум
    </div>

    <div id="soldier-info">
        <div style="color:#00d2ff; font-weight:bold; margin-bottom:5px;" id="s-name">Солдат</div>
        <div>Здоровье: <span id="s-hp" style="color:#00ff88">100</span></div>
        <div>Статус: <span id="s-status">Оборона</span></div>
        <div>Цель: <span id="s-target">Нет</span></div>
    </div>

    <canvas id="mapCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    render();
});

// Игровой движок и гео-проекция
const projection = d3.geoMercator().scale(180).translate([width / 2, height / 1.5]);
const pathGenerator = d3.geoPath().projection(projection).context(ctx);

let worldData = null;
let countries = [];
let selectedCountry = null;

// Настройки фракций
const FACTIONS = {
    PLAYER: { name: 'Россия', color: '#00d2ff', border: '#0088cc' },
    ENEMY: { name: 'Украина', color: '#ff4b2b', border: '#cc2b00' },
    NEUTRAL: { name: 'Нейтралы', color: '#2a3b5c', border: '#1d2942' }
};

// Живые человечки-солдаты
let soldiers = [];
const NAMES = ["Саша", "Михаил", "Иван", "Артем", "Дмитрий", "Егор", "Данил", "Андрей", "Никита", "Алексей"];

class Soldier {
    constructor(x, y, owner, homeRegion) {
        this.x = x + (Math.random() - 0.5) * 20;
        this.y = y + (Math.random() - 0.5) * 20;
        this.owner = owner; // PLAYER или ENEMY
        this.hp = 100;
        this.maxHp = 100;
        this.name = NAMES[Math.floor(Math.random() * NAMES.length)] + " #" + Math.floor(Math.random()*900 + 100);
        this.speed = 1.2 + Math.random() * 0.8;
        this.targetX = null;
        this.targetY = null;
        this.targetRegion = null;
        this.status = 'Idle'; // Idle, Marching, Combat
    }

    update() {
        if (this.targetX !== null && this.targetY !== null) {
            const dx = this.targetX - this.x;
            const dy = this.targetY - this.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 5) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                this.status = 'В марше к целям';
            } else {
                if (this.targetRegion) {
                    // Захват региона по прибытии
                    this.targetRegion.owner = this.owner;
                }
                this.targetX = null;
                this.targetY = null;
                this.status = 'В гарнизоне';
            }
        }

        // Логика боя рядом с врагами
        soldiers.forEach(other => {
            if (other.owner !== this.owner && Math.hypot(other.x - this.x, other.y - this.y) < 15) {
                this.status = 'Перестрелка!';
                this.hp -= 0.5;
            }
        });
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = this.owner === 'PLAYER' ? '#00f0ff' : '#ff3366';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Здоровье над головой
        if (this.hp < 100) {
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(this.x - 6, this.y - 8, 12, 2);
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(this.x - 6, this.y - 8, 12 * (this.hp / 100), 2);
        }
    }
}

// Загрузка настоящих векторных гео-данных мира
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(response => response.json())
    .then(data => {
        worldData = topojson.feature(data, data.objects.countries);
        
        // Разметка стран
        countries = worldData.features.map(f => {
            let owner = 'NEUTRAL';
            // ID стран из геоданных
            if (f.id === "643") owner = 'PLAYER'; // Россия
            if (f.id === "804") owner = 'ENEMY';  // Украина

            const center = pathGenerator.centroid(f);
            return {
                geo: f,
                owner: owner,
                center: center
            };
        });

        // Спавним стартовых людей на их землях
        countries.forEach(c => {
            if (c.center && !isNaN(c.center[0])) {
                let count = c.owner === 'PLAYER' ? 25 : (c.owner === 'ENEMY' ? 20 : 0);
                for (let i = 0; i < count; i++) {
                    soldiers.push(new Soldier(c.center[0], c.center[1], c.owner, c));
                }
            }
        });

        gameLoop();
    });

function mobilizeTroops() {
    const myCountries = countries.filter(c => c.owner === 'PLAYER');
    myCountries.forEach(c => {
        if (c.center && !isNaN(c.center[0])) {
            for (let i = 0; i < 5; i++) {
                soldiers.push(new Soldier(c.center[0], c.center[1], 'PLAYER', c));
            }
        }
    });
}

function updateHUD() {
    const mySoldiers = soldiers.filter(s => s.owner === 'PLAYER' && s.hp > 0);
    const myTerritories = countries.filter(c => c.owner === 'PLAYER');
    document.getElementById('soldier-count').innerText = mySoldiers.length;
    document.getElementById('territory-count').innerText = myTerritories.length;
}

// Захват кликов мыши на настоящей карте
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Нажатие на солдата (Инфо)
    let clickedSoldier = soldiers.find(s => Math.hypot(s.x - mx, s.y - my) < 10);
    if (clickedSoldier) {
        const info = document.getElementById('soldier-info');
        info.style.display = 'block';
        document.getElementById('s-name').innerText = clickedSoldier.name;
        document.getElementById('s-hp').innerText = Math.round(clickedSoldier.hp);
        document.getElementById('s-status').innerText = clickedSoldier.status;
        return;
    }

    // Ищем на какую страну кликнули
    const clickedRegion = countries.find(c => {
        return d3.geoContains(c.geo, projection.invert([mx, my]));
    });

    if (clickedRegion) {
        if (clickedRegion.owner === 'PLAYER') {
            selectedCountry = clickedRegion;
        } else if (selectedCountry && clickedRegion.center) {
            // Приказ своим людям маршировать и атаковать выбранную страну
            soldiers.filter(s => s.owner === 'PLAYER').forEach(s => {
                s.targetX = clickedRegion.center[0] + (Math.random() - 0.5) * 30;
                s.targetY = clickedRegion.center[1] + (Math.random() - 0.5) * 30;
                s.targetRegion = clickedRegion;
            });
            selectedCountry = null;
        }
    }
});

function gameLoop() {
    ctx.clearRect(0, 0, width, height);

    // 1. Отрисовка НАСТОЯЩЕЙ карты мира
    if (worldData) {
        countries.forEach(c => {
            ctx.beginPath();
            pathGenerator(c.geo);
            
            if (c === selectedCountry) {
                ctx.fillStyle = '#00ffff';
            } else if (c.owner === 'PLAYER') {
                ctx.fillStyle = '#0d2b45';
            } else if (c.owner === 'ENEMY') {
                ctx.fillStyle = '#450d18';
            } else {
                ctx.fillStyle = '#111823';
            }
            
            ctx.fill();
            ctx.strokeStyle = c.owner === 'PLAYER' ? '#00d2ff' : (c.owner === 'ENEMY' ? '#ff4b2b' : '#2c3e50');
            ctx.lineWidth = 1;
            ctx.stroke();
        });
    }

    // 2. Обновление и чистка погибших людей
    soldiers = soldiers.filter(s => s.hp > 0);
    soldiers.forEach(s => {
        s.update();
        s.draw();
    });

    updateHUD();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
