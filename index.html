<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>War of Dots: Global Conquest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #080d1a;
            color: #f3f4f6;
            overflow: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Custom glow buttons */
        .btn-upgrade {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }
        .btn-upgrade:hover:not(:disabled) {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }
        .btn-upgrade:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-upgrade:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col relative overflow-hidden bg-slate-950">

    <!-- CANVAS ENGINE -->
    <canvas id="gameCanvas" class="w-full h-full absolute inset-0 z-0 cursor-crosshair"></canvas>

    <!-- HEADER / TOP HUD -->
    <header class="absolute top-0 left-0 right-0 h-16 px-4 md:px-8 glass-panel z-10 flex items-center justify-between border-b border-cyan-900/40">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-burst text-cyan-400 text-2xl animate-pulse"></i>
            <div>
                <h1 class="font-orbitron font-black text-lg md:text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500">
                    WAR OF DOTS
                </h1>
                <p class="text-[10px] text-slate-400 tracking-widest uppercase font-semibold">State Conquest Real-Time RTS</p>
            </div>
        </div>

        <!-- STATS & RESOURCES -->
        <div class="flex items-center space-x-4 md:space-x-8">
            <!-- Player Territory Control -->
            <div class="flex items-center space-x-2 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-cyan-500/30">
                <i class="fa-solid fa-flag text-cyan-400 text-sm"></i>
                <div class="text-xs font-orbitron font-bold">
                    <span id="stat-nodes" class="text-cyan-300">0</span> <span class="text-slate-500 text-[10px]">ЗАЗВАТАНО</span>
                </div>
            </div>

            <!-- Total Player Armies -->
            <div class="flex items-center space-x-2 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-emerald-500/30">
                <i class="fa-solid fa-users text-emerald-400 text-sm"></i>
                <div class="text-xs font-orbitron font-bold">
                    <span id="stat-troops" class="text-emerald-300">0</span> <span class="text-slate-500 text-[10px]">ВОЙСКА</span>
                </div>
            </div>

            <!-- Energy / Cash Gold -->
            <div class="flex items-center space-x-2 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-amber-500/30">
                <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
                <div class="text-xs font-orbitron font-bold">
                    <span id="stat-gold" class="text-amber-300">0</span> <span class="text-amber-500/80 text-[10px]">(+$<span id="stat-gold-rate">0</span>/с)</span>
                </div>
            </div>
        </div>

        <!-- AUDIO & RESTART -->
        <div class="flex items-center space-x-2">
            <button id="btn-sound" onclick="toggleSound()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-900 border border-slate-700 text-cyan-400 hover:bg-slate-800 transition">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="restartGame()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-900 border border-slate-700 text-amber-400 hover:bg-slate-800 transition" title="Перезапустить">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- INSTRUCTIONS OVERLAY -->
    <div class="absolute top-20 left-4 z-10 pointer-events-none hidden md:block">
        <div class="glass-panel p-3 rounded-xl text-xs space-y-1 border border-slate-700/60 max-w-xs">
            <div class="font-orbitron font-bold text-cyan-400 flex items-center space-x-2">
                <i class="fa-solid fa-hand-pointer"></i>
                <span>КАК ИГРАТЬ</span>
            </div>
            <p class="text-slate-300 text-[11px] leading-tight">
                Зажми <span class="text-cyan-300 font-bold">ЛКМ / Палец</span> на своей синей территории и <span class="text-cyan-300 font-bold">протяни линию</span> к врагу. Рой точек атакует!
            </p>
        </div>
    </div>

    <!-- BOTTOM UPGRADE BAR (State.io style upgrades) -->
    <footer class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-10 flex items-center space-x-2 md:space-x-4 max-w-full px-2">
        <!-- Upgrade 1: Production Speed -->
        <button id="upg-prod-btn" onclick="buyUpgrade('prod')" class="btn-upgrade p-2 md:p-3 rounded-2xl flex items-center space-x-3 text-left">
            <div class="w-9 h-9 rounded-xl bg-cyan-950 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-base">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Прирост Точек</div>
                <div class="font-orbitron font-bold text-xs text-white">Ур. <span id="upg-prod-lvl">1</span></div>
                <div class="text-[11px] font-orbitron font-bold text-amber-400">$<span id="upg-prod-cost">50</span></div>
            </div>
        </button>

        <!-- Upgrade 2: Troop Movement Speed -->
        <button id="upg-speed-btn" onclick="buyUpgrade('speed')" class="btn-upgrade p-2 md:p-3 rounded-2xl flex items-center space-x-3 text-left">
            <div class="w-9 h-9 rounded-xl bg-emerald-950 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-base">
                <i class="fa-solid fa-gauge-high"></i>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Скорость Точек</div>
                <div class="font-orbitron font-bold text-xs text-white">Ур. <span id="upg-speed-lvl">1</span></div>
                <div class="text-[11px] font-orbitron font-bold text-amber-400">$<span id="upg-speed-cost">75</span></div>
            </div>
        </button>

        <!-- Upgrade 3: Starting / Max Troops -->
        <button id="upg-start-btn" onclick="buyUpgrade('start')" class="btn-upgrade p-2 md:p-3 rounded-2xl flex items-center space-x-3 text-left">
            <div class="w-9 h-9 rounded-xl bg-purple-950 border border-purple-500/40 flex items-center justify-center text-purple-400 text-base">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Старт Войск</div>
                <div class="font-orbitron font-bold text-xs text-white">Ур. <span id="upg-start-lvl">1</span></div>
                <div class="text-[11px] font-orbitron font-bold text-amber-400">$<span id="upg-start-cost">100</span></div>
            </div>
        </button>
    </footer>

    <!-- GAME OVER / WIN MODAL -->
    <div id="modal-end" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md">
        <div class="glass-panel p-8 rounded-3xl border border-cyan-500/40 max-w-md w-full text-center space-y-6 shadow-2xl">
            <div id="end-icon" class="text-6xl text-cyan-400">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h2 id="end-title" class="font-orbitron font-black text-3xl text-white">ПОБЕДА!</h2>
                <p id="end-subtitle" class="text-slate-400 text-sm mt-2">Вы захватили все территории на карте!</p>
            </div>
            <button onclick="restartGame()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-orbitron font-black text-sm uppercase tracking-wider shadow-lg shadow-cyan-500/30 transition">
                Играть Снова
            </button>
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        /* SOUND SYNTHESIZER (Web Audio API) */
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'launch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'conquer') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
            btn.className = `w-9 h-9 flex items-center justify-center rounded-lg bg-slate-900 border border-slate-700 ${soundEnabled ? 'text-cyan-400' : 'text-slate-500'}`;
        }

        /* FACTIONS & COLORS */
        const FACTIONS = {
            PLAYER: { id: 'PLAYER', name: 'Игрок', color: '#00f0ff', fill: 'rgba(0, 240, 255, 0.25)', border: '#00f0ff' },
            ENEMY_RED: { id: 'ENEMY_RED', name: 'Красная Держава', color: '#ff2a5f', fill: 'rgba(255, 42, 95, 0.25)', border: '#ff2a5f' },
            ENEMY_YELLOW: { id: 'ENEMY_YELLOW', name: 'Желтый Альянс', color: '#ffcc00', fill: 'rgba(255, 204, 0, 0.25)', border: '#ffcc00' },
            NEUTRAL: { id: 'NEUTRAL', name: 'Нейтралы', color: '#64748b', fill: 'rgba(100, 116, 139, 0.15)', border: '#475569' }
        };

        /* MAP POLYGONS & NODES (Stylized Eurasian & Global Territories) */
        // Formatted to fit normalized 1000x600 coordinates
        const REGIONS = [
            // Russia Regions
            {
                id: 'rus_moscow', name: 'Центр России', owner: 'PLAYER', troops: 25,
                center: { x: 540, y: 190 },
                path: [[480, 150], [580, 140], [600, 220], [520, 240], [470, 200]]
            },
            {
                id: 'rus_south', name: 'Юг России', owner: 'PLAYER', troops: 20,
                center: { x: 550, y: 280 },
                path: [[520, 240], [600, 220], [610, 310], [530, 320]]
            },
            {
                id: 'rus_ural', name: 'Урал', owner: 'NEUTRAL', troops: 15,
                center: { x: 670, y: 180 },
                path: [[600, 130], [730, 120], [720, 240], [600, 220]]
            },
            {
                id: 'rus_siberia', name: 'Сибирь', owner: 'NEUTRAL', troops: 30,
                center: { x: 810, y: 170 },
                path: [[730, 120], [920, 110], [890, 250], [720, 240]]
            },

            // Ukraine Regions
            {
                id: 'ukr_west', name: 'Запад Украины', owner: 'NEUTRAL', troops: 12,
                center: { x: 450, y: 250 },
                path: [[420, 220], [480, 210], [480, 280], [410, 270]]
            },
            {
                id: 'ukr_east', name: 'Восток Украины', owner: 'NEUTRAL', troops: 18,
                center: { x: 500, y: 270 },
                path: [[480, 210], [520, 240], [530, 320], [480, 280]]
            },

            // Europe
            {
                id: 'eur_north', name: 'Скандинавия', owner: 'NEUTRAL', troops: 15,
                center: { x: 420, y: 120 },
                path: [[370, 80], [460, 90], [450, 170], [390, 160]]
            },
            {
                id: 'eur_west', name: 'Зап. Европа', owner: 'ENEMY_YELLOW', troops: 35,
                center: { x: 340, y: 240 },
                path: [[280, 200], [400, 190], [410, 280], [300, 290]]
            },
            {
                id: 'eur_east', name: 'Вост. Европа', owner: 'NEUTRAL', troops: 20,
                center: { x: 420, y: 200 },
                path: [[400, 170], [480, 150], [470, 220], [400, 210]]
            },

            // Asia
            {
                id: 'chn_north', name: 'Сев. Китай', owner: 'ENEMY_RED', troops: 40,
                center: { x: 830, y: 310 },
                path: [[760, 260], [900, 250], [890, 360], [770, 350]]
            },
            {
                id: 'chn_south', name: 'Юж. Китай', owner: 'ENEMY_RED', troops: 30,
                center: { x: 820, y: 410 },
                path: [[770, 350], [890, 360], [860, 480], [750, 450]]
            },
            {
                id: 'ind', name: 'Индия', owner: 'NEUTRAL', troops: 25,
                center: { x: 700, y: 400 },
                path: [[630, 330], [760, 340], [730, 480], [640, 430]]
            },
            {
                id: 'mid_east', name: 'Ближний Восток', owner: 'NEUTRAL', troops: 20,
                center: { x: 580, y: 380 },
                path: [[530, 320], [630, 330], [630, 440], [530, 420]]
            },

            // Americas
            {
                id: 'usa_east', name: 'Восток США', owner: 'NEUTRAL', troops: 30,
                center: { x: 180, y: 240 },
                path: [[120, 180], [240, 180], [230, 310], [130, 300]]
            }
        ];

        /* GAME STATE */
        let gold = 100;
        let goldRate = 5;

        let upgrades = {
            prod: { level: 1, cost: 50, rate: 1.0 },
            speed: { level: 1, cost: 75, speed: 1.0 },
            start: { level: 1, cost: 100, bonus: 0 }
        };

        let movingDots = []; // Array of dot objects moving across the screen
        let activeDrag = null; // Currently dragged connection line { fromRegion, currentX, currentY }

        /* CANVAS INITIALIZATION */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Fit 1000x600 map coordinate space into canvas dynamically
            const scaleX = canvas.width / 1050;
            const scaleY = canvas.height / 650;
            scale = Math.min(scaleX, scaleY) * 0.9;

            offsetX = (canvas.width - 1000 * scale) / 2;
            offsetY = (canvas.height - 600 * scale) / 2;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function mapToCanvas(x, y) {
            return { x: x * scale + offsetX, y: y * scale + offsetY };
        }

        function canvasToMap(x, y) {
            return { x: (x - offsetX) / scale, y: (y - offsetY) / scale };
        }

        /* TROOP DOT MOVEMENTS & LAUNCHING */
        function sendTroopDots(fromRegion, toRegion) {
            if (fromRegion.id === toRegion.id || fromRegion.troops <= 1) return;

            const sendCount = Math.floor(fromRegion.troops * 0.65);
            fromRegion.troops -= sendCount;

            const startPos = mapToCanvas(fromRegion.center.x, fromRegion.center.y);
            const targetPos = mapToCanvas(toRegion.center.x, toRegion.center.y);

            playSound('launch');

            // Spawn stream of individual physical dots
            for (let i = 0; i < sendCount; i++) {
                const delay = i * (45 / upgrades.speed.speed); // Staggered stream
                movingDots.push({
                    owner: fromRegion.owner,
                    targetRegionId: toRegion.id,
                    x: startPos.x + (Math.random() * 16 - 8),
                    y: startPos.y + (Math.random() * 16 - 8),
                    startX: startPos.x,
                    startY: startPos.y,
                    targetX: targetPos.x,
                    targetY: targetPos.y,
                    progress: 0,
                    delay: delay,
                    speed: (0.006 + Math.random() * 0.002) * upgrades.speed.speed
                });
            }
        }

        /* GAME TICK & AUTOMATIC GENERATION */
        let lastTick = performance.now();
        let aiTimer = 0;

        function updateGame(now) {
            const dt = (now - lastTick) / 1000;
            lastTick = now;

            // 1. Passive Gold & Troop Production
            REGIONS.forEach(reg => {
                if (reg.owner !== 'FACTION_NONE') {
                    // Generate troops periodically
                    reg.troopProgress = (reg.troopProgress || 0) + dt * (reg.owner === 'PLAYER' ? upgrades.prod.rate : 0.8);
                    if (reg.troopProgress >= 2.0) {
                        reg.troops += 1;
                        reg.troopProgress = 0;
                    }
                }
            });

            // Gold accumulation
            const playerOwnedCount = REGIONS.filter(r => r.owner === 'PLAYER').length;
            goldRate = playerOwnedCount * 3;
            gold += goldRate * dt;

            // 2. Update Moving Troop Dots
            for (let i = movingDots.length - 1; i >= 0; i--) {
                const dot = movingDots[i];
                if (dot.delay > 0) {
                    dot.delay -= dt * 1000;
                    continue;
                }

                dot.progress += dot.speed;
                dot.x = dot.startX + (dot.targetX - dot.startX) * dot.progress;
                dot.y = dot.startY + (dot.targetY - dot.startY) * dot.progress;

                // Hit target region
                if (dot.progress >= 1.0) {
                    const targetRegion = REGIONS.find(r => r.id === dot.targetRegionId);
                    if (targetRegion) {
                        if (targetRegion.owner === dot.owner) {
                            targetRegion.troops += 1;
                            playSound('hit');
                        } else {
                            targetRegion.troops -= 1;
                            playSound('hit');
                            if (targetRegion.troops <= 0) {
                                targetRegion.owner = dot.owner;
                                targetRegion.troops = 1;
                                playSound('conquer');
                                checkEndGame();
                            }
                        }
                    }
                    movingDots.splice(i, 1);
                }
            }

            // 3. AI Opponent Bot Decisions
            aiTimer += dt;
            if (aiTimer > 2.5) {
                aiTimer = 0;
                runAiLogic();
            }

            updateUI();
        }

        function runAiLogic() {
            const aiRegions = REGIONS.filter(r => r.owner.startsWith('ENEMY'));
            if (aiRegions.length === 0) return;

            const source = aiRegions[Math.floor(Math.random() * aiRegions.length)];
            if (source.troops < 12) return;

            // Find closest neighbor or target
            const targets = REGIONS.filter(r => r.id !== source.id && r.owner !== source.owner);
            if (targets.length === 0) return;

            // Sort by distance
            targets.sort((a, b) => {
                const distA = Math.hypot(a.center.x - source.center.x, a.center.y - source.center.y);
                const distB = Math.hypot(b.center.x - source.center.x, b.center.y - source.center.y);
                return distA - distB;
            });

            sendTroopDots(source, targets[0]);
        }

        /* RENDERING ENGINE */
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Territory Polygons & Borders
            REGIONS.forEach(reg => {
                const faction = FACTIONS[reg.owner] || FACTIONS.NEUTRAL;

                ctx.beginPath();
                reg.path.forEach((pt, idx) => {
                    const pos = mapToCanvas(pt[0], pt[1]);
                    if (idx === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.closePath();

                // Territory Fill
                ctx.fillStyle = faction.fill;
                ctx.fill();

                // Territory Border Contour
                ctx.lineWidth = reg.owner === 'PLAYER' ? 3 : 2;
                ctx.strokeStyle = faction.border;
                ctx.shadowColor = faction.color;
                ctx.shadowBlur = reg.owner === 'PLAYER' ? 12 : 4;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // 2. Draw Connections / Active Drag Line
            if (activeDrag && activeDrag.fromRegion) {
                const startPos = mapToCanvas(activeDrag.fromRegion.center.x, activeDrag.fromRegion.center.y);
                ctx.beginPath();
                ctx.moveTo(startPos.x, startPos.y);
                ctx.lineTo(activeDrag.currentX, activeDrag.currentY);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00f0ff';
                ctx.setLineDash([8, 8]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 3. Draw Moving Troop Dots (War Stream)
            movingDots.forEach(dot => {
                if (dot.delay > 0) return;
                const faction = FACTIONS[dot.owner] || FACTIONS.NEUTRAL;

                ctx.beginPath();
                ctx.arc(dot.x, dot.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = faction.color;
                ctx.shadowColor = faction.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 4. Draw Node Badges & Troop Counts
            REGIONS.forEach(reg => {
                const center = mapToCanvas(reg.center.x, reg.center.y);
                const faction = FACTIONS[reg.owner] || FACTIONS.NEUTRAL;

                // Center Circle Badge
                ctx.beginPath();
                ctx.arc(center.x, center.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = faction.border;
                ctx.stroke();

                // Troop Count Text
                ctx.font = 'bold 13px Orbitron';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(reg.troops, center.x, center.y);

                // Region Title
                ctx.font = 'bold 11px Rajdhani';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText(reg.name, center.x, center.y + 28);
            });
        }

        function renderLoop(now) {
            updateGame(now);
            draw();
            requestAnimationFrame(renderLoop);
        }

        /* USER INTERACTION (TOUCH & MOUSE) */
        function getRegionAtCoords(mapX, mapY) {
            return REGIONS.find(reg => {
                const dist = Math.hypot(reg.center.x - mapX, reg.center.y - mapY);
                return dist <= 45; // Hitbox radius around node center
            });
        }

        function handlePointerDown(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const mapPos = canvasToMap(clientX - rect.left, clientY - rect.top);
            const clickedRegion = getRegionAtCoords(mapPos.x, mapPos.y);

            if (clickedRegion && clickedRegion.owner === 'PLAYER') {
                activeDrag = {
                    fromRegion: clickedRegion,
                    currentX: clientX - rect.left,
                    currentY: clientY - rect.top
                };
            }
        }

        function handlePointerMove(e) {
            if (!activeDrag) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            activeDrag.currentX = clientX - rect.left;
            activeDrag.currentY = clientY - rect.top;
        }

        function handlePointerUp(e) {
            if (!activeDrag) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

            const mapPos = canvasToMap(clientX - rect.left, clientY - rect.top);
            const targetRegion = getRegionAtCoords(mapPos.x, mapPos.y);

            if (targetRegion && targetRegion.id !== activeDrag.fromRegion.id) {
                sendTroopDots(activeDrag.fromRegion, targetRegion);
            }

            activeDrag = null;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: true });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: true });
        window.addEventListener('touchend', handlePointerUp);

        /* UPGRADES & UI UPDATES */
        function updateUI() {
            document.getElementById('stat-nodes').innerText = REGIONS.filter(r => r.owner === 'PLAYER').length;
            document.getElementById('stat-troops').innerText = REGIONS.filter(r => r.owner === 'PLAYER').reduce((acc, r) => acc + r.troops, 0);
            document.getElementById('stat-gold').innerText = Math.floor(gold);
            document.getElementById('stat-gold-rate').innerText = Math.floor(goldRate);

            // Update Upgrade Buttons
            ['prod', 'speed', 'start'].forEach(type => {
                const upg = upgrades[type];
                document.getElementById(`upg-${type}-lvl`).innerText = upg.level;
                document.getElementById(`upg-${type}-cost`).innerText = upg.cost;
                document.getElementById(`upg-${type}-btn`).disabled = gold < upg.cost;
            });
        }

        function buyUpgrade(type) {
            const upg = upgrades[type];
            if (gold >= upg.cost) {
                gold -= upg.cost;
                upg.level += 1;
                upg.cost = Math.round(upg.cost * 1.7);

                if (type === 'prod') upg.rate += 0.5;
                if (type === 'speed') upg.speed += 0.4;
                if (type === 'start') {
                    REGIONS.filter(r => r.owner === 'PLAYER').forEach(r => r.troops += 10);
                }

                playSound('conquer');
                updateUI();
            }
        }

        function checkEndGame() {
            const playerOwned = REGIONS.filter(r => r.owner === 'PLAYER').length;
            const enemyOwned = REGIONS.filter(r => r.owner.startsWith('ENEMY')).length;

            if (playerOwned === REGIONS.length) {
                showEndModal(true);
            } else if (playerOwned === 0) {
                showEndModal(false);
            }
        }

        function showEndModal(isWin) {
            const modal = document.getElementById('modal-end');
            modal.classList.remove('hidden');

            const title = document.getElementById('end-title');
            const subtitle = document.getElementById('end-subtitle');
            const icon = document.getElementById('end-icon');

            if (isWin) {
                title.innerText = 'ПОБЕДА!';
                subtitle.innerText = 'Вы захватили все территории на карте!';
                icon.innerHTML = '<i class="fa-solid fa-trophy text-amber-400"></i>';
            } else {
                title.innerText = 'ПОРАЖЕНИЕ!';
                subtitle.innerText = 'Ваши войска были уничтожены.';
                icon.innerHTML = '<i class="fa-solid fa-skull text-red-500"></i>';
            }
        }

        function restartGame() {
            document.getElementById('modal-end').classList.add('hidden');
            gold = 100;

            upgrades = {
                prod: { level: 1, cost: 50, rate: 1.0 },
                speed: { level: 1, cost: 75, speed: 1.0 },
                start: { level: 1, cost: 100, bonus: 0 }
            };

            // Reset Regions
            REGIONS[0].owner = 'PLAYER'; REGIONS[0].troops = 30;
            REGIONS[1].owner = 'PLAYER'; REGIONS[1].troops = 25;
            REGIONS[2].owner = 'NEUTRAL'; REGIONS[2].troops = 15;
            REGIONS[3].owner = 'NEUTRAL'; REGIONS[3].troops = 30;
            REGIONS[4].owner = 'NEUTRAL'; REGIONS[4].troops = 12;
            REGIONS[5].owner = 'NEUTRAL'; REGIONS[5].troops = 18;
            REGIONS[6].owner = 'NEUTRAL'; REGIONS[6].troops = 15;
            REGIONS[7].owner = 'ENEMY_YELLOW'; REGIONS[7].troops = 35;
            REGIONS[8].owner = 'NEUTRAL'; REGIONS[8].troops = 20;
            REGIONS[9].owner = 'ENEMY_RED'; REGIONS[9].troops = 40;
            REGIONS[10].owner = 'ENEMY_RED'; REGIONS[10].troops = 30;
            REGIONS[11].owner = 'NEUTRAL'; REGIONS[11].troops = 25;
            REGIONS[12].owner = 'NEUTRAL'; REGIONS[12].troops = 20;
            REGIONS[13].owner = 'NEUTRAL'; REGIONS[13].troops = 30;

            movingDots = [];
            activeDrag = null;
        }

        // Start render loop
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
